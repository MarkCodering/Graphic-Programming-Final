<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CM2030 Coursework 2 image-processing application starter"
    />
    <link rel="icon" href="data:," />
    <title>CM2030 Image Lab</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #070a12;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 20%, #1f2a5a 0, transparent 34%),
          radial-gradient(circle at 85% 80%, #3a164f 0, transparent 32%),
          #070a12;
      }

      main {
        width: min(1240px, 100%);
        padding: 24px;
      }

      .page-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 14px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #8b9cff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 38px);
        letter-spacing: -0.04em;
      }

      .page-note {
        max-width: 460px;
        margin: 0;
        color: #aab3c5;
        font-size: 13px;
        line-height: 1.45;
        text-align: right;
      }

      #canvas-shell {
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: #0b0f1a;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      canvas {
        width: 100% !important;
        height: auto !important;
        display: block;
      }

      #slider-shell {
        min-height: 35px;
        padding: 10px 18px 0;
      }

      #slider-shell input[type="range"] {
        width: min(420px, 100%);
        accent-color: #8b9cff;
      }

      @media (max-width: 760px) {
        main {
          padding: 12px;
        }

        .page-heading {
          align-items: start;
          flex-direction: column;
        }

        .page-note {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="page-heading">
        <div>
          <p class="eyebrow">CM2030 · Graphics Programming</p>
          <h1>Image Lab</h1>
        </div>
      </div>
      <section id="canvas-shell" aria-label="Coursework application"></section>
      <div id="slider-shell" aria-label="Task 2 threshold control"></div>
    </main>

    <script src="lib/p5.min.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
